services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-appointments-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    entrypoint: ["./entrypoint.sh"]
    # Definir `entrypoint` borra el CMD de la imagen, asi que hay que
    # reponerlo: es lo que `exec "$$@"` arranca al final del entrypoint.
    command: ["php-fpm"]
    networks:
      - laravel

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: my-appointments-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:5.7
    container_name: my-appointments-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel

  redis:
    image: redis:alpine
    container_name: my-appointments-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel

  # No arranca con `docker compose up`: un build fallido sobrescribe los
  # assets ya compilados de public/. Para recompilar, a proposito:
  #   docker compose --profile assets run --rm node
  node:
    image: node:16-alpine
    container_name: my-appointments-node
    profiles: ["assets"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: >
      sh -c "npm ci && npm run dev"
    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
