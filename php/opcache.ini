; Sin OPcache, PHP recompila los ~1000 archivos de Laravel en cada request,
; leyendolos por el bind mount (lento en Windows/WSL2). Con esto se cachea
; el bytecode y solo queda el stat de cada archivo.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; validate_timestamps=0: PHP no vuelve a mirar el disco. Sobre el bind
; mount de Windows ese chequeo cuesta ~1000 stat() por request y es el
; 95% del tiempo de respuesta (medido: 1.42s -> 0.08s).
;
; A cambio, los cambios de codigo NO se ven hasta recargar php-fpm:
;   docker compose kill -s SIGUSR2 app
opcache.validate_timestamps=0

; Evita resolver la ruta real de cada archivo una y otra vez.
realpath_cache_size=4096K
realpath_cache_ttl=600
